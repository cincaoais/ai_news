name: Daily digest (Actions scheduler)

# PRIMARY scheduler since 2026-08: the Claude Code Routine on claude.ai was
# retired when the user dropped the Claude subscription. This workflow drives
# the whole pipeline via scripts/run_digest.py, which calls the DeepSeek
# chat-completions API for the editorial step (deepseek-chat, ~fraction of a
# cent per run). No Claude Code CLI, no OAuth token, no claude.ai dependency.
# The editorial rules live in CLAUDE.md, which run_digest.py embeds verbatim
# into the API prompt. The Telegram-independent watchdog
# (.github/workflows/watchdog.yml) stays as the second alert channel.

on:
  workflow_dispatch:
    inputs:
      mock:
        description: >-
          Use --mock-claude with tests/fixtures/mock_selection.json instead of invoking
          the real LLM API. Needs no secrets. Forces --dry-run and --skip-state
          regardless of the dry_run input below.
        type: boolean
        default: true
      dry_run:
        description: >-
          Pass --dry-run to run_digest.py (print the digest instead of sending it to
          Telegram). Ignored when mock=true (dry-run is always forced true in mock mode).
        type: boolean
        default: true

  schedule:
    # `47 23 * * *` (UTC) = 07:47 MYT (UTC+8) the next day. Deliberately an
    # off-the-hour minute, not top-of-hour, per docs/01-RND.md's cron-drift
    # finding (GitHub Actions schedules queue and can slip several minutes
    # during platform load spikes, which cluster at :00 across every repo's
    # cron jobs; an off-hour minute avoids that queueing contention).
    - cron: "47 23 * * *"

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"

      - name: Run digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # On a `schedule` trigger, inputs.mock/inputs.dry_run are unset --
          # both compare false below, so the cron path runs the real,
          # non-mock, non-dry-run pipeline by design. workflow_dispatch is
          # the only trigger that can set mock=true or dry_run=true.
          if [ "${{ inputs.mock }}" = "true" ]; then
            python scripts/run_digest.py --mock-claude tests/fixtures/mock_selection.json --dry-run --skip-state
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/run_digest.py --dry-run
          else
            python scripts/run_digest.py
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/notify_failure.py "workflow: digest job failed - check Actions logs"
