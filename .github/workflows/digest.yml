name: Daily digest (Actions fallback)

# This workflow is the FALLBACK scheduler (docs/02-PLAN.md). The PRIMARY
# scheduler is a Claude Code Routine on the user's account (Slice 5) that
# follows RUNBOOK.md directly. This workflow instead drives the pipeline
# via scripts/run_digest.py, which shells out to `claude -p` itself --
# NOT anthropics/claude-code-action (blocks WebSearch/WebFetch, action#690),
# NOT `--bare` (incompatible with an OAuth token), and ANTHROPIC_API_KEY must
# NEVER be set here (it would outrank CLAUDE_CODE_OAUTH_TOKEN).

on:
  workflow_dispatch:
    inputs:
      mock:
        description: >-
          Use --mock-claude with tests/fixtures/mock_selection.json instead of invoking
          the real claude CLI. Needs no secrets. Forces --dry-run and --skip-state
          regardless of the dry_run input below.
        type: boolean
        default: true
      dry_run:
        description: >-
          Pass --dry-run to run_digest.py (print the digest instead of sending it to
          Telegram). Ignored when mock=true (dry-run is always forced true in mock mode).
        type: boolean
        default: true

  # Dormant fallback cron -- commented out on purpose. This workflow is not
  # declared usable until Slice 4's test gate is fully green: a green mock
  # workflow_dispatch run on GitHub, actionlint/YAML validation, AND the 48-h
  # token soak test (a real dispatch with CLAUDE_CODE_OAUTH_TOKEN at T0 and
  # again at T0+48h, both authenticating). Until then the Claude Code Routine
  # (Slice 5) is the only active scheduler.
  #
  # `47 23 * * *` (UTC) = 07:47 MYT (UTC+8) the next day. Deliberately an
  # off-the-hour minute, not top-of-hour, per docs/01-RND.md's cron-drift
  # finding (GitHub Actions schedules queue and can slip several minutes
  # during platform load spikes, which cluster at :00 across every repo's
  # cron jobs; an off-hour minute avoids that queueing contention).
  #
  # To enable once the soak test is green: uncomment the two lines below.
  # schedule:
  #   - cron: "47 23 * * *"

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"

      - name: Run digest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_RETRY_WATCHDOG: "1"
        run: |
          # On a `schedule` trigger (once the cron above is enabled),
          # inputs.mock/inputs.dry_run are unset -- both compare false below,
          # so the cron path runs the real, non-mock, non-dry-run pipeline
          # by design. workflow_dispatch is the only trigger that can set
          # mock=true or dry_run=true.
          if [ "${{ inputs.mock }}" = "true" ]; then
            python scripts/run_digest.py --mock-claude tests/fixtures/mock_selection.json --dry-run --skip-state
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/run_digest.py --dry-run
          else
            python scripts/run_digest.py
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/notify_failure.py "workflow: digest job failed - check Actions logs"
